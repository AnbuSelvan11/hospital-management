{% extends "base.html" %}
{% block content %}
<h2>Patients</h2>

<form method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="number" name="age" placeholder="Age" required>
    <select name="gender">
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>
    <input type="text" name="phone" placeholder="Phone" required>
    <input type="text" name="disease" placeholder="Disease" required>
    <button type="submit">Add Patient</button>
</form>
<form method="GET">
    <input type="text" name="q" placeholder="Search patient by name">
    <button type="submit">Search</button>
    <a href="/patients">Clear</a>
</form>
<table>
    <tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Disease</th><th>Action</th></tr>
    {% for p in all_patients %}
    <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.age }}</td>
        <td>{{ p.gender }}</td>
        <td>{{ p.phone }}</td>
        <td>{{ p.disease }}</td>
        <td>
    <a href="/patients/edit/{{ p._id }}">Edit</a> |
    <a class="del" href="/patients/delete/{{ p._id }}">Delete</a>
</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
